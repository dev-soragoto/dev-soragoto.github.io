name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clean deployment
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true

  build:
    runs-on: ubuntu-latest
    needs: cleanup
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          tar -xzf ${{ runner.temp }}/hugo.tar.gz -C ${{ runner.temp }}
          sudo mv ${{ runner.temp }}/hugo /usr/local/bin/
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify_indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Submit changed URLs to IndexNow
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/' 2>/dev/null || true)

          URLS=()
          BASE="https://soragoto.io"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            path=$(echo "$file" | sed 's|^content||' | sed 's|/index\.md$|/|' | sed 's|\.md$|/|')
            URLS+=("${BASE}${path}")
          done <<< "$CHANGED"

          # 没有内容变更时只提交首页
          if [ ${#URLS[@]} -eq 0 ]; then
            URLS=("${BASE}/")
          else
            URLS+=("${BASE}/")
          fi

          URL_JSON=$(printf '%s\n' "${URLS[@]}" | python3 -c "
          import sys, json
          urls = list(dict.fromkeys(line.strip() for line in sys.stdin if line.strip()))
          print(json.dumps(urls))
          ")

          echo "Submitting URLs: $URL_JSON"

          HTTP_CODE=$(curl -s -o /tmp/indexnow_resp.txt -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"soragoto.io\",
              \"key\": \"50e81e649562406f9457d50b94a0efe6\",
              \"keyLocation\": \"https://soragoto.io/50e81e649562406f9457d50b94a0efe6.txt\",
              \"urlList\": $URL_JSON
            }")

          cat /tmp/indexnow_resp.txt
          echo "Response code: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] && echo "✅ IndexNow submitted" || echo "⚠️ Unexpected: $HTTP_CODE"

  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
